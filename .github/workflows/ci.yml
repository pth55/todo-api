name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=html:coverage-report \
            --junitxml=test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage-report/

      - name: Build and Push Docker Image
        if: github.event_name == 'push'
        run: |
          echo ${{ secrets.DOCKERHUB_PASSWORD }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/todo-api:${{ github.run_number }} .
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/todo-api:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/todo-api:${{ github.run_number }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/todo-api:latest
          docker logout

