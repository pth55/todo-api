name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=html:coverage-report \
            --junitxml=test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage-report/

  build-scan-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'    # ← entire job skipped on PRs

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t todo-api:${{ github.run_number }} .
          docker tag todo-api:${{ github.run_number }} todo-api:latest

      - name: Trivy scan — JSON artifact
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: todo-api:latest
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Trivy scan — SARIF for Security tab
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: todo-api:latest
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload scan results as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: |
            trivy-results.json
            trivy-results.sarif
          retention-days: 30

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Trivy gate — block push if CRITICAL found
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: todo-api:latest
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Push to DockerHub
        run: |
          echo ${{ secrets.DOCKERHUB_PASSWORD }} | docker login \
            -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
          docker tag todo-api:${{ github.run_number }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-api:${{ github.run_number }}
          docker tag todo-api:latest \
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-api:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/todo-api:${{ github.run_number }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/todo-api:latest
          docker logout

      # - name: Publish coverage report to Nexus
